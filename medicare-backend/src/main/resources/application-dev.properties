# =====================================================================
# DEVELOPMENT PERSISTENT DATABASE CONFIGURATION (MySQL Mode)
# Runs out-of-the-box without requiring an external MySQL server installation,
# while maintaining full SQL and JPA schema fidelity.
# =====================================================================

spring.datasource.url=jdbc:h2:file:./data/medicaredb;AUTO_SERVER=TRUE;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Enable H2 web console for inspection at /h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false
