# =====================================================================
# MEDICARE BACKEND CONFIGURATION
# =====================================================================

spring.application.name=medicare-backend
server.port=${SERVER_PORT:8080}

# Active profile: 'dev' uses local file H2 (MySQL Mode) for zero-setup execution.
# Set to 'mysql' to connect to a live MySQL 8.x database server.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Multipart upload limits for Prescriptions (PDF, JPG, PNG)
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=20MB

# MediCare Custom Properties
medicare.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
medicare.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
medicare.upload.dir=${UPLOAD_DIR:./uploads/prescriptions}
medicare.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://127.0.0.1:8080,http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000}
